[package]
edition = "2024"
name = "iso_mist"
rust-version = "1.95"
version = "0.1.0"
default-run = "iso_mist"

[[bin]]
name = "iso_mist"
path = "./src/bin/main.rs"
test = false

[[test]]
harness = false
name = "hello_test"

[lib]
test = false

[dependencies]
critical-section = "1.2.0"

defmt = "1.0.1"

defmt-rtt = "1.3.1"

embassy-time = { version = "0.5.0", features = ["defmt"] }

embedded-graphics = "0.8.2"

embedded-hal-bus = "0.3.0"

esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32c6"] }

embassy-embedded-hal = "0.6.0"

embassy-executor = { version = "0.10.0", features = ["defmt"] }

esp-backtrace = { version = "0.20.0", features = [
    "esp32c6",
    "defmt",
    "panic-handler",
] }

esp-hal = { version = "~1.2.2", features = ["defmt", "esp32c6", "unstable"] }

esp-println = { version = "0.18.0", features = ["esp32c6"] }

esp-rtos = { version = "0.4.0", features = ["defmt", "embassy", "esp32c6"] }

fugit = "0.6.0"

heapless = "0.9.4"

sht4x = { version = "0.2.0", features = ["embedded-hal-async"] }

ssd1306 = "0.10.0"

static_cell = "2.1.1"

[dev-dependencies]
embedded-test = { version = "0.7.1", features = [
    "defmt",
    "embassy-010",
    "external-executor",
] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2         # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
